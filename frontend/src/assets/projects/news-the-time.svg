<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="nt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#111c35" />
      <stop offset="100%" stop-color="#070c18" />
    </linearGradient>
    <linearGradient id="nt-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="nt-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="nt-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#nt-bg)"/>

  <!-- Top App Navigation Bar -->
  <rect x="40" y="30" width="1120" height="70" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Logo & Title -->
  <rect x="65" y="45" width="40" height="40" rx="10" fill="url(#nt-red)" />
  <text x="85" y="71" font-family="system-ui, sans-serif" font-size="20" text-anchor="middle" fill="#ffffff">📰</text>
  <text x="120" y="70" font-family="system-ui, sans-serif" font-weight="900" font-size="22" fill="#ffffff">News The Time</text>
  <text x="290" y="70" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">| সর্বশেষ বাংলা সংবাদ ও লাইভ খবর</text>

  <!-- Categories in Topbar -->
  <rect x="740" y="47" width="85" height="36" rx="18" fill="#1e293b"/>
  <text x="782" y="70" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#e2e8f0">জাতীয়</text>

  <rect x="835" y="47" width="90" height="36" rx="18" fill="#1e293b"/>
  <text x="880" y="70" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#e2e8f0">আন্তর্জাতিক</text>

  <rect x="935" y="47" width="95" height="36" rx="18" fill="#1e293b"/>
  <text x="982" y="70" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#e2e8f0">প্রযুক্তি ও খেলা</text>

  <rect x="1040" y="47" width="95" height="36" rx="18" fill="url(#nt-blue)"/>
  <text x="1087" y="70" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">ই-পেপার</text>

  <!-- Breaking News Ticker -->
  <rect x="40" y="115" width="1120" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="48" y="122" width="105" height="28" rx="6" fill="url(#nt-red)" />
  <text x="100" y="141" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#ffffff">সদ্য সংবাদ ⚡</text>
  <text x="170" y="141" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#f8fafc">আজকের শীর্ষ সংবাদ: আধুনিক প্রযুক্তিতে বাংলাদেশের যুব সমাজের নতুন দিগন্ত  •  বিজ্ঞান ও কৃত্রিম বুদ্ধিমত্তার অগ্রগতি  •  ক্রীড়াঙ্গনে সাফল্য...</text>

  <!-- Featured News Section (2 cols) -->
  <!-- Left Big Lead Article -->
  <g transform="translate(40, 175)" filter="url(#nt-shadow)">
    <rect width="680" height="460" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Simulated Article Image -->
    <rect x="16" y="16" width="648" height="240" rx="12" fill="#1e293b"/>
    <text x="340" y="145" font-family="system-ui, sans-serif" font-size="56" text-anchor="middle">📡</text>
    <rect x="35" y="35" width="90" height="26" rx="13" fill="#dc2626"/>
    <text x="80" y="52" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">বিশেষ প্রতিবেদন</text>

    <!-- Headline and preview -->
    <text x="25" y="295" font-family="system-ui, sans-serif" font-weight="800" font-size="24" fill="#ffffff">ডিজিটাল বাংলাদেশ থেকে স্মার্ট ভবিষ্যতের পথে প্রযুক্তি উদ্ভাবন</text>
    <text x="25" y="330" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">তরুণ সফটওয়্যার প্রকৌশলী ও শিক্ষার্থীদের হাত ধরে দেশের প্রযুক্তি খাত সমৃদ্ধ হচ্ছে। বিশ্বমানের উদ্ভাবন ও স্টার্টআপ সংস্কৃতি...</text>
    <text x="25" y="360" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">অনলাইন পোর্টালের মাধ্যমে রিয়েল-টাইম সংবাদ পরিবেশন এখন সময়ের দাবি।</text>
    
    <line x1="25" y1="395" x2="655" y2="395" stroke="#1e293b" stroke-width="1"/>
    <text x="25" y="425" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">🕒 ৫ মিনিট আগে  •  প্রযুক্তি বিভাগ  •  রিপোর্টার: বিশেষ প্রতিনিধি</text>
    
    <rect x="525" y="405" width="130" height="34" rx="17" fill="#2563eb"/>
    <text x="590" y="426" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">সম্পূর্ণ পড়ুন &rarr;</text>
  </g>

  <!-- Right Sidebar News List -->
  <g transform="translate(740, 175)" filter="url(#nt-shadow)">
    <rect width="420" height="460" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    
    <text x="25" y="40" font-family="system-ui, sans-serif" font-weight="800" font-size="18" fill="#ffffff">🔥 জনপ্রিয় ও আলোচিত খবর</text>
    <line x1="25" y1="55" x2="395" y2="55" stroke="#1e293b" stroke-width="1"/>

    <!-- News Item 1 -->
    <g transform="translate(25, 75)">
      <rect width="70" height="65" rx="8" fill="#1e293b"/>
      <text x="35" y="40" font-family="system-ui, sans-serif" font-size="24" text-anchor="middle">💻</text>
      <text x="85" y="20" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#f1f5f9">শিক্ষাঙ্গনে কোডিং ও এআই চর্চা</text>
      <text x="85" y="40" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">বিশ্ববিদ্যালয় পর্যায়ে বৃদ্ধি পাচ্ছে সফটওয়্যার ল্যাব...</text>
      <text x="85" y="60" font-family="system-ui, sans-serif" font-size="11" fill="#3b82f6">শিক্ষা ও ক্যাম্পাস  •  ১০ মিনিট আগে</text>
    </g>

    <line x1="25" y1="160" x2="395" y2="160" stroke="#1e293b" stroke-width="1"/>

    <!-- News Item 2 -->
    <g transform="translate(25, 180)">
      <rect width="70" height="65" rx="8" fill="#1e293b"/>
      <text x="35" y="40" font-family="system-ui, sans-serif" font-size="24" text-anchor="middle">⚽</text>
      <text x="85" y="20" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#f1f5f9">চ্যাম্পিয়ন্স লিগ উত্তেজনাপূর্ণ কোয়ার্টার ফাইনাল</text>
      <text x="85" y="40" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">শ্বাসরুদ্ধকর লড়াইয়ে শেষ মুহূর্তের গোলে জয়...</text>
      <text x="85" y="60" font-family="system-ui, sans-serif" font-size="11" fill="#3b82f6">খেলাধুলা  •  ২৫ মিনিট আগে</text>
    </g>

    <line x1="25" y1="265" x2="395" y2="265" stroke="#1e293b" stroke-width="1"/>

    <!-- News Item 3 -->
    <g transform="translate(25, 285)">
      <rect width="70" height="65" rx="8" fill="#1e293b"/>
      <text x="35" y="40" font-family="system-ui, sans-serif" font-size="24" text-anchor="middle">🌍</text>
      <text x="85" y="20" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#f1f5f9">বৈশ্বিক জলবায়ু সম্মেলনে নতুন রূপরেখা</text>
      <text x="85" y="40" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">কার্বন নিঃসরণ হ্রাসে বিশ্বনেতাদের ঐকমত্য...</text>
      <text x="85" y="60" font-family="system-ui, sans-serif" font-size="11" fill="#3b82f6">আন্তর্জাতিক  •  ১ ঘণ্টা আগে</text>
    </g>

    <line x1="25" y1="370" x2="395" y2="370" stroke="#1e293b" stroke-width="1"/>

    <!-- Newsletter / Subscribe -->
    <rect x="25" y="390" width="370" height="48" rx="10" fill="#1e293b"/>
    <text x="45" y="420" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">ইমেইল দিন সর্বশেষ খবরের জন্য...</text>
    <rect x="280" y="396" width="105" height="36" rx="8" fill="url(#nt-red)"/>
    <text x="332" y="419" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">সাবস্ক্রাইব</text>
  </g>
</svg>
